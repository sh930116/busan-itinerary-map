<head>

  <title>釜山 8 天 7 夜｜互動行程地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --ink:#1f2937; --muted:#667085; --line:#e5e7eb; --surface:#fff; --accent:#d53f46; --soft:#fff5f5; }
    * { box-sizing:border-box; }
    html, body { max-width:100%; overflow-x:hidden; }
    body { margin:0; color:var(--ink); background:#f6f7f9; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
    header { padding:20px 26px 14px; background:var(--surface); border-bottom:1px solid var(--line); }
    .title-row { align-items:center; display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; }
    .text-file-link { border:1px solid var(--line); border-radius:8px; color:var(--ink); cursor:pointer; font:inherit; font-size:13px; padding:7px 10px; text-decoration:none; white-space:nowrap; }
    .header-actions { align-items:center; display:flex; flex-wrap:wrap; gap:8px; }
    h1 { margin:0 0 6px; font-size:23px; font-weight:700; }
    header p { margin:0; color:var(--muted); font-size:14px; }
    .layout { display:grid; grid-template-columns:minmax(310px, 43%) 1fr; gap:0; height:calc(100vh - 92px); }
    .itinerary { height:100%; overflow-y:auto; padding:18px; background:var(--surface); border-right:1px solid var(--line); }
    .day { margin:0 0 18px; }
    .day h2 { margin:0 0 8px; font-size:16px; font-weight:700; }
    .day h2 span { color:var(--muted); font-size:13px; font-weight:500; }
    .place { width:100%; appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; cursor:pointer; display:block; margin:6px 0; padding:10px 12px; text-align:left; font:inherit; transition:.16s ease; }
    .place:hover, .place:focus { border-color:var(--accent); background:var(--soft); outline:none; }
    .place.is-active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(213,63,70,.14); background:var(--soft); }
    .place strong { display:block; font-size:14px; }
    .place small { display:block; margin-top:3px; color:var(--muted); font-size:12px; line-height:1.4; }
    .map-area { position:sticky; top:0; height:calc(100vh - 92px); display:flex; flex-direction:column; }
    .map-tools { align-items:center; background:var(--surface); border-bottom:1px solid var(--line); display:flex; flex:0 0 auto; flex-wrap:wrap; gap:8px; padding:10px 14px; }
    .map-tools button, .map-tools a { border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); cursor:pointer; font:inherit; font-size:13px; padding:7px 10px; text-decoration:none; white-space:nowrap; }
    .map-tools button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    #life-button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    #life-categories { align-items:center; background:var(--soft); border-bottom:1px solid var(--line); display:flex; flex:0 0 auto; flex-wrap:wrap; gap:6px; padding:8px 14px; }
    #life-categories .life-cat { border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--ink); cursor:pointer; font:inherit; font-size:12.5px; padding:6px 12px; white-space:nowrap; }
    #life-categories .life-cat.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .map-tools .selected { color:var(--muted); flex:1 1 100%; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #geoji-fab { align-items:center; background:#3B1E1E; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.25); color:#fff; display:flex; font-size:14px; font-weight:700; gap:8px; padding:13px 20px; position:fixed; right:18px; bottom:18px; text-decoration:none; z-index:999; transition:.15s ease; }
    #geoji-fab:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.3); }
    #geoji-fab .fab-icon { align-items:center; background:#fff; border-radius:50%; color:#3B1E1E; display:flex; flex-shrink:0; font-size:13px; font-weight:900; height:24px; justify-content:center; width:24px; }
    @media (max-width:640px){ #geoji-fab { bottom:14px; right:14px; padding:12px 16px; font-size:13px; } }
    #overview, #google-map, #naver-panel, #food-panel { flex:1 1 auto; min-height:0; width:100%; }
    #google-map { border:0; }
    #naver-panel, #food-panel { align-items:center; background:var(--surface); display:flex; flex-direction:column; justify-content:center; overflow:auto; padding:24px; text-align:center; }
    #naver-panel .naver-icon, #food-panel .naver-icon { align-items:center; background:var(--soft); border-radius:50%; color:var(--accent); display:flex; font-size:26px; font-weight:800; height:56px; justify-content:center; margin-bottom:14px; width:56px; }
    #naver-panel h3, #food-panel h3 { margin:0 0 6px; font-size:17px; }
    #naver-panel p.hint, #food-panel p.hint { color:var(--muted); font-size:13px; line-height:1.6; margin:0 0 20px; max-width:360px; }
    #food-panel .ko-term { background:var(--soft); border-radius:8px; color:var(--ink); font-size:15px; font-weight:700; margin:0 0 16px; padding:8px 14px; }
    .naver-links { display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; }
    .naver-link-btn { border:1px solid var(--line); border-radius:10px; color:var(--ink); display:block; font-size:14px; font-weight:600; padding:12px 14px; text-decoration:none; transition:.16s ease; cursor:pointer; }
    .naver-link-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .naver-link-btn:hover { opacity:.9; }
    .naver-link-btn small { color:inherit; display:block; font-size:12px; font-weight:400; margin-top:2px; opacity:.85; }
    .pin { align-items:center; background:var(--accent); border:2px solid #fff; border-radius:50%; color:#fff; display:flex; font:700 11px/1 sans-serif; height:25px; justify-content:center; width:25px; }
    .transit-icon { display:inline-block; width:1em; height:1em; vertical-align:-0.15em; margin:0 1px; fill:currentColor; flex-shrink:0; }
    .leaflet-popup-content { font-family:inherit; }
    .leaflet-popup-content b { display:block; margin-bottom:3px; }
    @media (max-width:760px) {
      header { padding:14px 16px 10px; }
      h1 { font-size:18px; }
      header p { font-size:12.5px; }
      .layout { grid-template-columns:1fr; }
      .itinerary { border-right:0; border-bottom:1px solid var(--line); height:30vh; max-height:30vh; padding:12px; }
      .map-area { height:60vh; }
      .map-tools { padding:8px 10px; gap:6px; }
      .map-tools button, .map-tools a { font-size:12px; padding:6px 8px; }
      #geoji-fab span:last-child { display:none; }
      #geoji-fab { padding:12px; }
    }
  </style>
</head>

  <header>

      <div id="naver-panel" style="display:none"></div>
      <div id="food-panel" style="display:none"></div>
    </section>
  </main>

    function lifeEmbedUrl(p, term){ return 'https://www.google.com/maps?q='+encodeURIComponent(term)+'&ll='+p.lat+','+p.lng+'&z='+LIFE_ZOOM+'&output=embed'; }
    function lifeOpenUrl(p, term){ return 'https://www.google.com/maps/search/'+encodeURIComponent(term)+'/@'+p.lat+','+p.lng+','+LIFE_ZOOM+'z'; }
    function showLife(p, catId){ overview.style.display='none'; naverPanel.style.display='none'; foodPanel.style.display='none'; frame.style.display='block'; setActiveButton('life'); lifePlaceId = Object.keys(places).find(k=>places[k]===p) || lifePlaceId; currentLifeCat = catId || currentLifeCat; const cat = LIFE_CATEGORIES[currentLifeCat] || LIFE_CATEGORIES.restaurant; frame.src = lifeEmbedUrl(p, cat.term); openLife.href = lifeOpenUrl(p, cat.term); selectedName.textContent = p.name+' 附近約 2km｜'+cat.label; document.querySelectorAll('#life-categories .life-cat').forEach(b=>b.classList.toggle('active', b.dataset.cat===currentLifeCat)); }
    document.querySelectorAll('#life-categories .life-cat').forEach(btn => btn.addEventListener('click', ()=>{ const p = lifePlaceId ? places[lifePlaceId] : (document.querySelector('.place.is-active') ? places[document.querySelector('.place.is-active').dataset.id] : places[Object.keys(places)[0]]); showLife(p, btn.dataset.cat); }));
    function activatePlace(btn){
      const id=btn.dataset.id, p=places[id];
      if(!p) return;
      const previous=previousPlaceId && previousPlaceId!==id ? places[previousPlaceId] : null;
      document.querySelectorAll('.place').forEach(x=>x.classList.remove('is-active'));
      btn.classList.add('is-active');
      map.setView([p.lat,p.lng],14);
      if(markers[id]) markers[id].openPopup();
      if(currentMode==='naver'){ showNaver(p,previous); } else if(currentMode==='food'){ showFood(p); } else if(currentMode==='life'){ showLife(p, currentLifeCat); } else { showGoogle(p,previous); }
      previousPlaceId=id;
    }
    document.getElementById('itinerary').addEventListener('click', e => { const btn = e.target.closest('.place[data-id]'); if(btn) activatePlace(btn); });
    overviewButton.addEventListener('click',showOverview);
    googleButton.addEventListener('click',()=>{ const active=document.querySelector('.place.is-active'); if(active){ showGoogle(places[active.dataset.id]); } else { showGoogle(places[Object.keys(places)[0]]); } });
    naverButton.addEventListener('click',()=>{ const active=document.querySelector('.place.is-active'); if(active){ showNaver(places[active.dataset.id]); } else { showNaver(places[Object.keys(places)[0]]); } });
    foodButton.addEventListener('click',()=>{ const active=document.querySelector('.place.is-active'); if(active){ showFood(places[active.dataset.id]); } else { showFood(places[Object.keys(places)[0]]); } });
    lifeButton.addEventListener('click',()=>{ const active=document.querySelector('.place.is-active'); const p = active ? places[active.dataset.id] : places[Object.keys(places)[0]]; showLife(p, currentLifeCat); });

    // ---- 動態讀取 busan-itinerary.txt 並產生行程清單與地圖圖釘 ----
    const ALIASES = { '南浦／松島周邊午餐':'songdo', '西面／富田晚餐與自由活動':'seomyeon' };
    const WALK_SVG = '<svg class="transit-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>';
    const SUBWAY_SVG = '<svg class="transit-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h2.23l2-2H12h1.77l2 2H18v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zM7.5 17c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm3.5-7H6V6h5v4zm2 0V6h5v4h-5zm3.5 7c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>';
    const BUS_SVG = '<svg class="transit-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM18 11H6V6h12v5z"/></svg>';
    const TAXI_ICON = '🚕';
    function normName(s){ return (s||'').replace(/[（）()／/｜|,、\s\-–]/g,''); }
    function matchPlace(name){
      if(!name) return null;
      if(ALIASES[name] && places[ALIASES[name]]) return ALIASES[name];
      for(const [id,p] of Object.entries(places)){ if(p.name===name) return id; }
      const n = normName(name);
      for(const [id,p] of Object.entries(places)){ const pn = normName(p.name); if(pn && (n.includes(pn) || pn.includes(n))) return id; }
      return null;
    }
    function timeToMinutes(t){ const m=t.match(/^(\d{1,2}):(\d{2})/); if(!m) return null; return (+m[1])*60+(+m[2]); }
    function formatDuration(mins){ if(mins==null||mins<=0) return null; const h=Math.floor(mins/60), m=mins%60; if(h>0&&m>0) return h+'小時'+m+'分'; if(h>0) return h+'小時'; return m+'分'; }
    function transitIconsHtml(text){ const icons=[]; if(/地鐵|站|전철|블루라인|동해선|輕軌/.test(text)) icons.push(SUBWAY_SVG); if(/巴士|公車|버스/.test(text)) icons.push(BUS_SVG); if(/步行|도보/.test(text)) icons.push(WALK_SVG); if(/計程車|taxi|택시/.test(text)) icons.push(TAXI_ICON); return [...new Set(icons)].join(''); }
    function parseStayMinutes(desc){
      if(!desc) return 0;
      const m = desc.match(/約\s*([\d.]+)\s*小時\s*(?:([\d]+)\s*分)?|約\s*([\d]+)\s*分/);
      if(!m) return 0;
      if(m[1]) return parseFloat(m[1])*60 + (m[2]?parseInt(m[2],10):0);
      if(m[3]) return parseInt(m[3],10);
      return 0;
    }
    function buildSuffix(fromStop, toStop){
      if(!toStop) return '';
      let durationMins = null;
      if(fromStop && toStop){
        let gap = timeToMinutes(toStop.time) - timeToMinutes(fromStop.time);
        if(gap!=null && gap<0) gap += 24*60;
        if(gap!=null){ const stay = parseStayMinutes(fromStop.desc); durationMins = gap - stay; if(durationMins<=0) durationMins = null; }
      }
      const durationText = formatDuration(durationMins);
      const iconsHtml = transitIconsHtml(toStop.transit || '');
      if(!iconsHtml && !durationText) return '';
      return '　（' + iconsHtml + (durationText ? (iconsHtml?' ':'') + durationText : '') + '）';
    }
    function parseItinerary(text){
      const dayHeaderRe = /^Day\s*(\d+)｜([^\n]*)$/gm;
      const headers = []; let hm;
      while((hm = dayHeaderRe.exec(text))){ headers.push({num:hm[1], title:hm[2].trim(), start:hm.index, blockStart:dayHeaderRe.lastIndex}); }
      const stopMarkerIdx = text.indexOf('\n修改格式範例');
      const days = [];
      headers.forEach((h,i) => {
        const blockEnd = i+1 < headers.length ? headers[i+1].start : (stopMarkerIdx>-1 ? stopMarkerIdx : text.length);
        const block = text.slice(h.blockStart, blockEnd);
        const stops = block.split('\n').map(l=>l.trim()).filter(l=>l.startsWith('- ')).map(line => {
          const body = line.slice(2);
          const parts = body.split('｜').map(s=>s.trim());
          if(!/^\d{1,2}:\d{2}$/.test(parts[0]||'')) return null;
          return { time:parts[0], name:parts[1]||'', desc:parts[2]||'', transit:parts[3]||'' };
        }).filter(Boolean);
        if(stops.length) days.push({ num:h.num, title:h.title, stops });
      });
      return days;
    }
    function renderItinerary(days){
      const container = document.getElementById('itinerary');
      container.innerHTML = '';
      let unmatchedCount = 0;
      let pinIndex = 0;
      days.forEach(day => {
        const dayEl = document.createElement('div');
        dayEl.className = 'day';
        const h2 = document.createElement('h2');
        h2.innerHTML = 'Day '+day.num+' <span>'+day.title.replace(/[<>]/g,'')+'</span>';
        dayEl.appendChild(h2);
        day.stops.forEach((stop, i) => {
          const placeId = matchPlace(stop.name);
          const suffix = buildSuffix(stop, day.stops[i+1]);
          const smallParts = [stop.time+'｜'+stop.desc];
          if(stop.transit) smallParts.push('交通：'+stop.transit);
          const smallHtml = smallParts.join('<br>');
          if(placeId){
            const p = places[placeId];
            if(!markers[placeId]){ pinIndex++; markers[placeId] = L.marker([p.lat,p.lng],{icon:icon(pinIndex)}).addTo(map).bindPopup('<b>'+p.name+'</b><span>點選左側行程可開啟 Google 地圖定位</span>'); }
            const btn = document.createElement('button');
            btn.className = 'place'; btn.type = 'button'; btn.dataset.id = placeId;
            btn.innerHTML = '<strong>'+stop.name+suffix+'</strong><small>'+smallHtml+'</small>';
            dayEl.appendChild(btn);
          } else {
            unmatchedCount++;
            const div = document.createElement('div');
            div.className = 'place place-unmatched';
            div.style.opacity = '.65'; div.style.cursor = 'default';
            div.innerHTML = '<strong>'+stop.name+suffix+'</strong><small>'+smallHtml+'（尚未對應地圖座標，僅顯示文字）</small>';
            dayEl.appendChild(div);
          }
        });
        container.appendChild(dayEl);
      });
      if(unmatchedCount>0){ const note=document.createElement('p'); note.style.cssText='color:var(--muted);font-size:12px;margin-top:10px;'; note.textContent='有 '+unmatchedCount+' 個地點在文字檔裡找不到對應的地圖座標，已用文字顯示。'; container.appendChild(note); }
    }
    async function initItinerary(){
      const status = document.getElementById('itinerary-status');
      try {
        const res = await fetch('busan-itinerary.txt', {cache:'no-store'});
        if(!res.ok) throw new Error('HTTP '+res.status);
        const text = await res.text();
        const days = parseItinerary(text);
        if(!days.length) throw new Error('沒有解析到任何 Day 行程');
        if(status) status.remove();
        renderItinerary(days);
      } catch(err) {
        if(status) status.innerHTML = '⚠️ 行程文字檔載入失敗（'+err.message+'）。請確認 busan-itinerary.txt 是否跟這個網頁在同一個資料夾／同一個 GitHub 位置，且格式符合說明。<br><br><a href="busan-itinerary.txt" target="_blank" rel="noopener">直接開啟文字檔看看</a>';
        console.error('itinerary load failed', err);
      }
    }
    initItinerary();
  </script>
