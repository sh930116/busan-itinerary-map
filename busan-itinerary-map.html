    const ALIASES = {

    const WALK_SVG = '<svg class="transit-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>';

    const TAXI_ICON = '🚕';

      if(/計程車|taxi|택시/.test(groundText)) return 'driving';

    function parseStayMinutes(desc){

    function parseItinerary(text){

          if(placeId && nextStop){
            const nextPlaceId = matchPlace(nextStop.name);

          }
          const smallParts = [stop.time+'｜'+stop.desc];
          if(stop.transit) smallParts.push('交通：'+stop.transit);

            noteBtn.textContent = '！';

            const row = document.createElement('div');

            row.appendChild(div);

    async function initItinerary(){

  <script>
    (function(){
      // ====== 請先到 https://console.firebase.google.com/ 建立一個免費專案，
      // 新增一個「Web app」，並開通「Realtime Database」（測試模式即可），
      // 再把下面六個值換成你自己專案的設定值（在 Firebase 主控台 > 專案設定 > 一般 可以看到）======
      const firebaseConfig = {
        apiKey: "AIzaSyACASqeRh4VKleITK6TFEplalvscwKGav0",
        authDomain: "busan-travel-3b335.firebaseapp.com",
        databaseURL: "https://busan-travel-3b335-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "busan-travel-3b335",
        storageBucket: "busan-travel-3b335.firebasestorage.app",
        messagingSenderId: "1041054125575",
        appId: "1:1041054125575:web:5ddef0c2b3ab21616924a2"
      };
      const isConfigured = !String(firebaseConfig.apiKey).startsWith('YOUR_');
      let fbReady = false;
      function ensureFirebaseInit(){
        if(fbReady || !isConfigured) return isConfigured;
        try { if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); fbReady = true; return true; } catch(err){ return false; }
      }
      const NAME_KEY = 'busan-must-have-name';

      // 建立一個可重複使用的留言板：傳入各元素 id 前綴、Firebase 路徑，回傳 { open(path,title), close() }
      function createBoard(prefix){
        const overlay = document.getElementById(prefix+'-overlay');
        const closeBtn = document.getElementById(prefix+'-close');
        const listEl = document.getElementById(prefix+'-list');
        const nameInput = document.getElementById(prefix+'-name');
        const textInput = document.getElementById(prefix+'-text');
        const sendBtn = document.getElementById(prefix+'-send');
        const statusEl = document.getElementById(prefix+'-status');
        nameInput.value = localStorage.getItem(NAME_KEY) || '';
        let notesRef = null;

        function renderNotes(notesObj){
          const notes = Object.entries(notesObj || {}).map(([key, v]) => ({ key, ...v })).sort((a,b) => (b.ts||0) - (a.ts||0));
          if(!notes.length){ listEl.innerHTML = '<div class="mh-empty">還沒有留言，第一則留言等你來寫！</div>'; return; }
          listEl.innerHTML = notes.map(n => {
            const time = n.ts ? new Date(n.ts).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
            const author = (n.author || '匿名').replace(/[<>]/g,'');
            return '<div class="mh-note" data-key="'+n.key+'"><button class="mh-del" data-key="'+n.key+'" title="刪除這則留言">刪除</button><div class="mh-meta">'+author+'　'+time+'</div><div class="mh-text"></div></div>';
          }).join('');
          listEl.querySelectorAll('.mh-note').forEach((el, i) => { el.querySelector('.mh-text').textContent = notes[i].text || ''; });
        }

        function connect(dbPath){
          if(notesRef) notesRef.off();
          if(!ensureFirebaseInit()){
            listEl.innerHTML = '<div class="mh-empty">留言板還沒設定好雲端資料庫。<br><br>請到 <a href="https://console.firebase.google.com/" target="_blank" rel="noopener">Firebase 主控台</a> 建立一個免費專案＋開通 Realtime Database，然後把設定值填進網頁原始碼裡 firebaseConfig 的地方，存檔後上傳到 GitHub 即可。</div>';
            sendBtn.disabled = true;
            return;
          }
          sendBtn.disabled = false;
          listEl.innerHTML = '<div class="mh-empty">載入中…</div>';
          try {
            notesRef = firebase.database().ref(dbPath);
            notesRef.on('value', snap => { renderNotes(snap.val()); }, err => { listEl.innerHTML = '<div class="mh-empty">讀取留言失敗：'+err.message+'</div>'; });
          } catch(err){
            listEl.innerHTML = '<div class="mh-empty">留言板初始化失敗：'+err.message+'</div>';
          }
        }

        function sendNote(){
          const text = textInput.value.trim();
          if(!text) return;
          const author = nameInput.value.trim() || '匿名';
          localStorage.setItem(NAME_KEY, author);
          if(!notesRef){ statusEl.textContent = '尚未連上雲端資料庫，無法送出'; return; }
          sendBtn.disabled = true;
          notesRef.push({ author, text, ts: Date.now() })
            .then(() => { textInput.value = ''; statusEl.textContent = ''; })
            .catch(err => { statusEl.textContent = '送出失敗：'+err.message; })
            .finally(() => { sendBtn.disabled = false; });
        }
        function deleteNote(key){ if(!notesRef) return; notesRef.child(key).remove().catch(err => { statusEl.textContent = '刪除失敗：'+err.message; }); }

        function close(){ overlay.classList.remove('open'); }
        closeBtn.addEventListener('click', close);
        overlay.addEventListener('click', e => { if(e.target === overlay) close(); });
        document.addEventListener('keydown', e => { if(e.key === 'Escape' && overlay.classList.contains('open')) close(); });
        sendBtn.addEventListener('click', sendNote);
        textInput.addEventListener('keydown', e => { if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendNote(); });
        listEl.addEventListener('click', e => { const btn = e.target.closest('.mh-del'); if(btn) deleteNote(btn.dataset.key); });

        return { open(dbPath){ overlay.classList.add('open'); connect(dbPath); setTimeout(()=>textInput.focus(),0); }, close };
      }

      const mustHaveBoard = createBoard('must-have');
      document.getElementById('must-have-button').addEventListener('click', () => mustHaveBoard.open('busan-must-have-notes'));

      // 簡易共用備忘錄：一個地點對應一段文字，任何人打開都能直接編輯，自動同步、自動儲存
      function createMemo(prefix){
        const overlay = document.getElementById(prefix+'-overlay');
        const closeBtn = document.getElementById(prefix+'-close');
        const textarea = document.getElementById(prefix+'-textarea');
        const statusEl = document.getElementById(prefix+'-status');
        const titleEl = document.getElementById(prefix+'-title');
        let memoRef = null;
        let saveTimer = null;

        function connect(dbPath){
          if(memoRef) memoRef.off();
          if(!ensureFirebaseInit()){
            textarea.value = '';
            textarea.disabled = true;
            statusEl.textContent = '尚未設定雲端資料庫，暫時無法使用備忘錄';
            return;
          }
          textarea.disabled = false;
          statusEl.textContent = '載入中…';
          try {
            memoRef = firebase.database().ref(dbPath);
            memoRef.on('value', snap => {
              const val = snap.val() || '';
              if(document.activeElement !== textarea){ textarea.value = val; }
              statusEl.textContent = '已同步';
            }, err => { statusEl.textContent = '讀取失敗：'+err.message; });
          } catch(err){
            statusEl.textContent = '初始化失敗：'+err.message;
          }
        }
        function save(){
          if(!memoRef) return;
          memoRef.set(textarea.value)
            .then(() => { statusEl.textContent = '已儲存'; })
            .catch(err => { statusEl.textContent = '儲存失敗：'+err.message; });
        }
        textarea.addEventListener('input', () => { statusEl.textContent = '輸入中…'; clearTimeout(saveTimer); saveTimer = setTimeout(save, 600); });
        function close(){ overlay.classList.remove('open'); }
        closeBtn.addEventListener('click', close);
        overlay.addEventListener('click', e => { if(e.target === overlay) close(); });
        document.addEventListener('keydown', e => { if(e.key === 'Escape' && overlay.classList.contains('open')) close(); });

        return { open(dbPath, label){ overlay.classList.add('open'); titleEl.innerHTML = label+'<small>任何人都可以直接編輯，會自動同步、自動儲存</small>'; connect(dbPath); setTimeout(()=>textarea.focus(),0); } };
      }

      const placeMemo = createMemo('place-notes');
      function slugify(text){ return String(text).trim().replace(/[^\w\u4e00-\u9fff\uac00-\ud7a3]+/g,'-').replace(/^-+|-+$/g,'') || 'note'; }
      document.getElementById('itinerary').addEventListener('click', e => {
        const btn = e.target.closest('.place-note-btn');
        if(!btn) return;
        const placeId = btn.dataset.id || slugify(btn.dataset.name);
        const label = btn.dataset.name || placeId;
        placeMemo.open('busan-place-memo/'+encodeURIComponent(placeId), label);

      function renderFoodList(filter){
        const q = (filter||'').trim().toLowerCase();
        const tbody = document.getElementById('food-list-tbody');
        const countEl = document.getElementById('food-list-count');
        const rows = FOOD_LIST.filter(r => !q || r[1].toLowerCase().includes(q) || r[2].toLowerCase().includes(q) || r[3].toLowerCase().includes(q));
        countEl.textContent = '共 '+rows.length+' 項'+(q?'（篩選中）':'');
        tbody.innerHTML = rows.map(r => (
          '<tr data-row-id="'+r[0]+'"><td class="fl-id">'+r[0]+'</td><td><span class="fl-cn" data-id="'+r[0]+'">'+r[1]+'</span></td><td><button type="button" class="fl-ko-btn" data-ko="'+r[2].replace(/"/g,'&quot;')+'">'+r[2]+'</button></td><td class="fl-desc">'+r[3]+'</td></tr>'
        )).join('');
      }
      const foodListOverlay = document.getElementById('food-list-overlay');
      const foodListClose = document.getElementById('food-list-close');
      const foodListSearch = document.getElementById('food-list-search');
      document.getElementById('food-list-button').addEventListener('click', () => {
        foodListOverlay.classList.add('open');
        if(!document.getElementById('food-list-tbody').children.length) renderFoodList('');
        setTimeout(()=>foodListSearch.focus(),0);
      });
      function closeFoodList(){ foodListOverlay.classList.remove('open'); }
      foodListClose.addEventListener('click', closeFoodList);
      foodListOverlay.addEventListener('click', e => { if(e.target === foodListOverlay) closeFoodList(); });
      document.addEventListener('keydown', e => { if(e.key === 'Escape' && foodListOverlay.classList.contains('open')) closeFoodList(); });
      foodListSearch.addEventListener('input', () => renderFoodList(foodListSearch.value));
      document.getElementById('food-list-tbody').addEventListener('click', e => {
        const btn = e.target.closest('.fl-ko-btn');
        if(!btn) return;
        const ko = btn.dataset.ko;
        navigator.clipboard.writeText(ko).then(() => {
          const original = btn.textContent;
          btn.textContent = '已複製！';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1200);
        }).catch(() => {
          btn.textContent = '複製失敗';
          setTimeout(() => { btn.textContent = ko; }, 1200);
        });
      });

      // ---- 美食圖片預覽：桌機滑鼠移入浮動小卡，手機點擊展開內嵌列 ----
      const isHoverDevice = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      const foodImgCache = new Map(); // id -> { src, source } | null(查無圖片) | undefined(尚未查詢)
      async function queryThumbnail(apiBase, term){
        const url = apiBase+'?action=query&generator=search&gsrsearch='+encodeURIComponent(term)+'&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=300&format=json&origin=*';
        const res = await fetch(url);
        const data = await res.json();
        const pages = data && data.query && data.query.pages;
        const page = pages ? Object.values(pages)[0] : null;
        return (page && page.thumbnail && page.thumbnail.source) ? { src: page.thumbnail.source } : null;
      }
      async function fetchFoodImage(koTerm){
        if(foodImgCache.has(koTerm)) return foodImgCache.get(koTerm);
        let result = null;
        // 韓文維基百科：對韓國美食條目的覆蓋率最好，優先查這裡
        try { result = await queryThumbnail('https://ko.wikipedia.org/w/api.php', koTerm); } catch(err){ result = null; }
        // 找不到的話，退而求其次查 Wikimedia Commons 圖庫
        if(!result){ try { result = await queryThumbnail('https://commons.wikimedia.org/w/api.php', koTerm); } catch(err){ result = null; } }
        foodImgCache.set(koTerm, result);
        return result;
      }
      function googleImgUrl(koTerm){ return 'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(koTerm); }
      function previewInnerHtml(state, koTerm, cnName){
        const googleLink = '<a class="fl-tip-link" href="'+googleImgUrl(koTerm)+'" target="_blank" rel="noopener">用「'+koTerm+'」到 Google 搜圖 ↗</a>';
        if(state === 'loading') return '<div class="fl-tip-loading">圖片載入中…</div>';
        if(!state) return '<div class="fl-tip-empty">找不到現成圖片</div>'+googleLink;
        return '<img src="'+state.src+'" alt="'+cnName+'" loading="lazy">'+'<div class="fl-tip-caption">'+cnName+'（'+koTerm+'）</div>'+googleLink;
      }

      // 桌機：浮動提示框跟著游標
      const imgTooltip = document.getElementById('food-img-tooltip');
      let tooltipToken = 0;
      function positionTooltip(x, y){
        const pad = 14, w = 200, h = 210;
        let left = x + pad, top = y + pad;
        if(left + w > window.innerWidth) left = x - w - pad;
        if(top + h > window.innerHeight) top = y - h - pad;
        imgTooltip.style.left = Math.max(8, left) + 'px';
        imgTooltip.style.top = Math.max(8, top) + 'px';
      }
      function hideTooltip(){ imgTooltip.classList.remove('show'); }
      if(isHoverDevice){
        document.getElementById('food-list-tbody').addEventListener('mouseover', e => {
          const cn = e.target.closest('.fl-cn');
          if(!cn) return;
          const row = FOOD_LIST.find(r => String(r[0]) === cn.dataset.id);
          if(!row) return;
          const myToken = ++tooltipToken;
          imgTooltip.innerHTML = previewInnerHtml('loading');
          imgTooltip.classList.add('show');
          fetchFoodImage(row[2]).then(result => {
            if(myToken !== tooltipToken) return; // 使用者已經移到別的項目，結果過期就不顯示
            imgTooltip.innerHTML = previewInnerHtml(result, row[2], row[1]);
          });
        });
        document.getElementById('food-list-tbody').addEventListener('mousemove', e => {
          if(e.target.closest('.fl-cn') || imgTooltip.classList.contains('show')) positionTooltip(e.clientX, e.clientY);
        });
        document.getElementById('food-list-tbody').addEventListener('mouseout', e => {
          if(e.target.closest('.fl-cn') && !e.relatedTarget?.closest('.fl-cn')) hideTooltip();
        });
        document.getElementById('food-list-table-wrap').addEventListener('scroll', hideTooltip);
      } else {
        // 手機／觸控：點擊中文名稱在該列下方展開圖片預覽（再點一次收合）
        document.getElementById('food-list-tbody').addEventListener('click', e => {
          const cn = e.target.closest('.fl-cn');
          if(!cn) return;
          const tr = cn.closest('tr');
          const nextRow = tr.nextElementSibling;
          if(nextRow && nextRow.classList.contains('fl-preview-row')){ nextRow.remove(); return; }
          document.querySelectorAll('.fl-preview-row').forEach(el => el.remove());
          const row = FOOD_LIST.find(r => String(r[0]) === cn.dataset.id);
          if(!row) return;
          const previewRow = document.createElement('tr');
          previewRow.className = 'fl-preview-row';
          previewRow.innerHTML = '<td colspan="4">'+previewInnerHtml('loading')+'</td>';
          tr.insertAdjacentElement('afterend', previewRow);
          fetchFoodImage(row[2]).then(result => {
            if(!previewRow.isConnected) return;
            previewRow.innerHTML = '<td colspan="4">'+previewInnerHtml(result, row[2], row[1])+'</td>';
          });
        });
      }
    })();
  </script>
