    const ALIASES = {
      '南浦／松島周邊午餐':'songdo',
      '西面／富田晚餐與自由活動':'seomyeon',
      '西面地鐵站':'seomyeon',

    const WALK_SVG = '<svg class="transit-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>';
    const SUBWAY_SVG = '<svg class="transit-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h2.23l2-2H12h1.77l2 2H18v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zM7.5 17c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm3.5-7H6V6h5v4zm2 0V6h5v4h-5zm3.5 7c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>';
    const BUS_SVG = '<svg class="transit-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM18 11H6V6h12v5z"/></svg>';
    const TAXI_ICON = '🚕';
    function normName(s){ return (s||'').replace(/[（）()／/｜|,、\s\-–]/g,''); }
    function matchPlace(name){
      if(!name) return null;
      if(ALIASES[name] && places[ALIASES[name]]) return ALIASES[name];
      for(const [id,p] of Object.entries(places)){ if(p.name===name) return id; }
      const n = normName(name);
      for(const [id,p] of Object.entries(places)){ const pn = normName(p.name); if(pn && (n.includes(pn) || pn.includes(n))) return id; }
      return null;
    }
    function timeToMinutes(t){ const m=t.match(/^(\d{1,2}):(\d{2})/); if(!m) return null; return (+m[1])*60+(+m[2]); }
    function formatDuration(mins){ if(mins==null||mins<=0) return null; const h=Math.floor(mins/60), m=mins%60; if(h>0&&m>0) return h+'小時'+m+'分'; if(h>0) return h+'小時'; return m+'分'; }
    const PLANE_ICON = '✈️';
    const WALK_OVERRIDE = /走路到|走到|步行到|走路轉乘|步行轉乘|도보로/;
    function transitIconsHtml(groundText, flightText){
      if(/起飛|降落|登機|報到|託運|航班|flight/i.test(flightText || '')) return PLANE_ICON;
      if(WALK_OVERRIDE.test(groundText)) return WALK_SVG;
      const icons=[];
      if(/地鐵|捷運|輕軌|列車|藍線|경전철|전철|호선|블루라인|동해선|轉乘|直達|坐\s*\d+\s*站/.test(groundText)) icons.push(SUBWAY_SVG);
      if(/巴士|公車|버스/.test(groundText)) icons.push(BUS_SVG);
      if(/步行|도보|走路/.test(groundText)) icons.push(WALK_SVG);
      if(/計程車|taxi|택시/.test(groundText)) icons.push(TAXI_ICON);
      return [...new Set(icons)].join('');
    }
    function detectPrimaryMode(fromStop, toStop){
      if(!toStop) return null;
      const groundText = (toStop.transit || '') + ' ' + (toStop.desc || '');
      if(WALK_OVERRIDE.test(groundText)) return 'walking';
      const hasSubwayOrBus = /地鐵|捷運|輕軌|列車|藍線|경전철|전철|호선|블루라인|동해선|轉乘|直達|坐\s*\d+\s*站|巴士|公車|버스/.test(groundText);
      const hasTaxi = /計程車|taxi|택시/.test(groundText);
      const hasWalk = /步行|도보|走路/.test(groundText);
      if(hasTaxi && !hasSubwayOrBus) return 'driving';
      if(hasSubwayOrBus) return 'transit';
      if(hasWalk) return 'walking';
      return null;
    }
    function parseStayMinutes(desc){
      if(!desc) return 0;
      const m = desc.match(/約\s*([\d.]+)\s*小時\s*(?:([\d]+)\s*分)?|約\s*([\d]+)\s*分/);
      if(!m) return 0;
      if(m[1]) return parseFloat(m[1])*60 + (m[2]?parseInt(m[2],10):0);
      if(m[3]) return parseInt(m[3],10);
      return 0;
    }
    function buildSuffix(fromStop, toStop){
      if(!toStop) return '';
      let durationMins = null;
      if(fromStop && toStop){
        let gap = timeToMinutes(toStop.time) - timeToMinutes(fromStop.time);
        if(gap!=null && gap<0) gap += 24*60;
        if(gap!=null){ const stay = parseStayMinutes(fromStop.desc); durationMins = gap - stay; if(durationMins<=0) durationMins = null; }
      }
      const durationText = formatDuration(durationMins);
      const groundText = (toStop.transit || '') + ' ' + (toStop.desc || '');
      const flightText = (fromStop ? fromStop.desc || '' : '') + ' ' + groundText;
      const iconsHtml = transitIconsHtml(groundText, flightText);
      if(!iconsHtml && !durationText) return '';
      return '　（' + iconsHtml + (durationText ? (iconsHtml?' ':'') + durationText : '') + '）';
    }
    function parseItinerary(text){
      const dayHeaderRe = /^Day\s*(\d+)｜([^\n]*)$/gm;
      const headers = []; let hm;
      while((hm = dayHeaderRe.exec(text))){ headers.push({num:hm[1], title:hm[2].trim(), start:hm.index, blockStart:dayHeaderRe.lastIndex}); }
      const stopMarkerIdx = text.indexOf('\n修改格式範例');
      const days = [];
      headers.forEach((h,i) => {
        const blockEnd = i+1 < headers.length ? headers[i+1].start : (stopMarkerIdx>-1 ? stopMarkerIdx : text.length);
        const block = text.slice(h.blockStart, blockEnd);
        const stops = block.split('\n').map(l=>l.trim()).filter(l=>l.startsWith('- ')).map(line => {
          const body = line.slice(2);
          const parts = body.split('｜').map(s=>s.trim());
          if(!/^\d{1,2}:\d{2}$/.test(parts[0]||'')) return null;
          return { time:parts[0], name:parts[1]||'', desc:parts[2]||'', transit:parts[3]||'' };
        }).filter(Boolean);
        if(stops.length) days.push({ num:h.num, title:h.title, stops });
      });
      return days;
    }
    function renderItinerary(days){
      const container = document.getElementById('itinerary');
      container.innerHTML = '';
      let unmatchedCount = 0;
      let pinIndex = 0;
      days.forEach(day => {
        const dayEl = document.createElement('div');
        dayEl.className = 'day';
        const h2 = document.createElement('h2');
        h2.innerHTML = 'Day '+day.num+' <span>'+day.title.replace(/[<>]/g,'')+'</span>';
        dayEl.appendChild(h2);
        day.stops.forEach((stop, i) => {
          const placeId = matchPlace(stop.name);
          const nextStop = day.stops[i+1];
          const suffix = buildSuffix(stop, nextStop);
          if(placeId && nextStop){
            const nextPlaceId = matchPlace(nextStop.name);
            if(nextPlaceId && nextPlaceId !== placeId){
              const mode = detectPrimaryMode(stop, nextStop);
              if(mode) transitModeByPair.set(placeId+'>'+nextPlaceId, mode);
            }
          }
          const smallParts = [stop.time+'｜'+stop.desc];
          if(stop.transit) smallParts.push('交通：'+stop.transit);
          const smallHtml = smallParts.join('<br>');
          if(placeId){
            const p = places[placeId];
            if(!markers[placeId]){ pinIndex++; markers[placeId] = L.marker([p.lat,p.lng],{icon:icon(pinIndex)}).addTo(map).bindPopup('<b>'+p.name+'</b><span>點選左側行程可開啟 Google 地圖定位</span>'); }
            const btn = document.createElement('button');
            btn.className = 'place'; btn.type = 'button'; btn.dataset.id = placeId;
            btn.innerHTML = '<strong>'+stop.name+suffix+'</strong><small>'+smallHtml+'</small>';
            const row = document.createElement('div');
            row.className = 'place-row';
            row.appendChild(btn);
            const noteBtn = document.createElement('button');
            noteBtn.type = 'button'; noteBtn.className = 'place-note-btn'; noteBtn.dataset.id = placeId; noteBtn.dataset.name = stop.name; noteBtn.title = '注意事項／準備事項';
            noteBtn.textContent = '！';
            row.appendChild(noteBtn);
            dayEl.appendChild(row);
          } else {
            unmatchedCount++;
            const div = document.createElement('div');
            div.className = 'place place-unmatched';
            div.style.opacity = '.65'; div.style.cursor = 'default';
            div.innerHTML = '<strong>'+stop.name+suffix+'</strong><small>'+smallHtml+'（尚未對應地圖座標，僅顯示文字）</small>';
            const row = document.createElement('div');
            row.className = 'place-row';
            row.appendChild(div);
            const noteBtn = document.createElement('button');
            noteBtn.type = 'button'; noteBtn.className = 'place-note-btn'; noteBtn.dataset.name = stop.name; noteBtn.title = '注意事項／準備事項';
            noteBtn.textContent = '！';
            row.appendChild(noteBtn);
            dayEl.appendChild(row);
          }
        });
        container.appendChild(dayEl);
      });
      if(unmatchedCount>0){ const note=document.createElement('p'); note.style.cssText='color:var(--muted);font-size:12px;margin-top:10px;'; note.textContent='有 '+unmatchedCount+' 個地點在文字檔裡找不到對應的地圖座標，已用文字顯示。'; container.appendChild(note); }
    }
    async function initItinerary(){
      const status = document.getElementById('itinerary-status');
      try {
        const res = await fetch('busan-itinerary.txt', {cache:'no-store'});
        if(!res.ok) throw new Error('HTTP '+res.status);

      const firebaseConfig = {
        apiKey: "AIzaSyACASqeRh4VKleITK6TFEplalvscwKGav0",
        authDomain: "busan-travel-3b335.firebaseapp.com",
        databaseURL: "https://busan-travel-3b335-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "busan-travel-3b335",
        storageBucket: "busan-travel-3b335.firebasestorage.app",
        messagingSenderId: "1041054125575",
        appId: "1:1041054125575:web:5ddef0c2b3ab21616924a2"
      };
      const isConfigured = !String(firebaseConfig.apiKey).startsWith('YOUR_');
      let fbReady = false;
      function ensureFirebaseInit(){
        if(fbReady || !isConfigured) return isConfigured;
        try { if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); fbReady = true; return true; } catch(err){ return false; }
      }
      const NAME_KEY = 'busan-must-have-name';

      // 建立一個可重複使用的留言板：傳入各元素 id 前綴、Firebase 路徑，回傳 { open(path,title), close() }
      function createBoard(prefix){
        const overlay = document.getElementById(prefix+'-overlay');
        const closeBtn = document.getElementById(prefix+'-close');
        const listEl = document.getElementById(prefix+'-list');
        const nameInput = document.getElementById(prefix+'-name');
        const textInput = document.getElementById(prefix+'-text');
        const sendBtn = document.getElementById(prefix+'-send');
        const statusEl = document.getElementById(prefix+'-status');
        nameInput.value = localStorage.getItem(NAME_KEY) || '';
        let notesRef = null;

        function renderNotes(notesObj){
          const notes = Object.entries(notesObj || {}).map(([key, v]) => ({ key, ...v })).sort((a,b) => (b.ts||0) - (a.ts||0));
          if(!notes.length){ listEl.innerHTML = '<div class="mh-empty">還沒有留言，第一則留言等你來寫！</div>'; return; }
          listEl.innerHTML = notes.map(n => {
            const time = n.ts ? new Date(n.ts).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
            const author = (n.author || '匿名').replace(/[<>]/g,'');
            return '<div class="mh-note" data-key="'+n.key+'"><button class="mh-del" data-key="'+n.key+'" title="刪除這則留言">刪除</button><div class="mh-meta">'+author+'　'+time+'</div><div class="mh-text"></div></div>';
          }).join('');
          listEl.querySelectorAll('.mh-note').forEach((el, i) => { el.querySelector('.mh-text').textContent = notes[i].text || ''; });
        }

        function connect(dbPath){
          if(notesRef) notesRef.off();
          if(!ensureFirebaseInit()){
            listEl.innerHTML = '<div class="mh-empty">留言板還沒設定好雲端資料庫。<br><br>請到 <a href="https://console.firebase.google.com/" target="_blank" rel="noopener">Firebase 主控台</a> 建立一個免費專案＋開通 Realtime Database，然後把設定值填進網頁原始碼裡 firebaseConfig 的地方，存檔後上傳到 GitHub 即可。</div>';
            sendBtn.disabled = true;
            return;
          }
          sendBtn.disabled = false;
          listEl.innerHTML = '<div class="mh-empty">載入中…</div>';
          try {
            notesRef = firebase.database().ref(dbPath);
            notesRef.on('value', snap => { renderNotes(snap.val()); }, err => { listEl.innerHTML = '<div class="mh-empty">讀取留言失敗：'+err.message+'</div>'; });
          } catch(err){
            listEl.innerHTML = '<div class="mh-empty">留言板初始化失敗：'+err.message+'</div>';
          }
        }

        function sendNote(){
          const text = textInput.value.trim();
          if(!text) return;
          const author = nameInput.value.trim() || '匿名';
          localStorage.setItem(NAME_KEY, author);
          if(!notesRef){ statusEl.textContent = '尚未連上雲端資料庫，無法送出'; return; }
          sendBtn.disabled = true;
          notesRef.push({ author, text, ts: Date.now() })
            .then(() => { textInput.value = ''; statusEl.textContent = ''; })
            .catch(err => { statusEl.textContent = '送出失敗：'+err.message; })
            .finally(() => { sendBtn.disabled = false; });
        }
        function deleteNote(key){ if(!notesRef) return; notesRef.child(key).remove().catch(err => { statusEl.textContent = '刪除失敗：'+err.message; }); }

        function close(){ overlay.classList.remove('open'); }
        closeBtn.addEventListener('click', close);
        overlay.addEventListener('click', e => { if(e.target === overlay) close(); });
        document.addEventListener('keydown', e => { if(e.key === 'Escape' && overlay.classList.contains('open')) close(); });
        sendBtn.addEventListener('click', sendNote);
        textInput.addEventListener('keydown', e => { if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendNote(); });
        listEl.addEventListener('click', e => { const btn = e.target.closest('.mh-del'); if(btn) deleteNote(btn.dataset.key); });

        return { open(dbPath){ overlay.classList.add('open'); connect(dbPath); setTimeout(()=>textInput.focus(),0); }, close };
      }

      const mustHaveBoard = createBoard('must-have');
      document.getElementById('must-have-button').addEventListener('click', () => mustHaveBoard.open('busan-must-have-notes'));

      const placeNotesBoard = createBoard('place-notes');
      const placeNotesTitle = document.getElementById('place-notes-title');
      function slugify(text){ return String(text).trim().replace(/[^\w\u4e00-\u9fff\uac00-\ud7a3]+/g,'-').replace(/^-+|-+$/g,'') || 'note'; }
      document.getElementById('itinerary').addEventListener('click', e => {
        const btn = e.target.closest('.place-note-btn');
        if(!btn) return;
        const placeId = btn.dataset.id || slugify(btn.dataset.name);
        const label = btn.dataset.name || placeId;
        placeNotesTitle.innerHTML = label+'<small>這個地點的提醒、準備事項，大家都能看到、都能新增</small>';
        placeNotesBoard.open('busan-place-notes/'+encodeURIComponent(placeId));
      });
    })();
  </script>
</body>
</html>
