<html lang="zh-Hant">
<head>

  <title>釜山 8 天 7 夜｜互動行程地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --ink:#1f2937; --muted:#667085; --line:#e5e7eb; --surface:#fff; --accent:#d53f46; --soft:#fff5f5; }
    * { box-sizing:border-box; }
    html, body { max-width:100%; overflow-x:hidden; }
    body { margin:0; color:var(--ink); background:#f6f7f9; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
    header { padding:20px 26px 14px; background:var(--surface); border-bottom:1px solid var(--line); }
    .title-row { align-items:center; display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; }
    .text-file-link { border:1px solid var(--line); border-radius:8px; color:var(--ink); cursor:pointer; font:inherit; font-size:13px; padding:7px 10px; text-decoration:none; white-space:nowrap; }
    .header-actions { align-items:center; display:flex; flex-wrap:wrap; gap:8px; }
    h1 { margin:0 0 6px; font-size:23px; font-weight:700; }
    header p { margin:0; color:var(--muted); font-size:14px; }
    .layout { display:grid; grid-template-columns:minmax(310px, 43%) 1fr; gap:0; height:calc(100vh - 92px); }
    .itinerary { height:100%; overflow-y:auto; padding:18px; background:var(--surface); border-right:1px solid var(--line); }
    .day { margin:0 0 18px; }
    .day h2 { margin:0 0 8px; font-size:16px; font-weight:700; }
    .day h2 span { color:var(--muted); font-size:13px; font-weight:500; }
    .place { width:100%; appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; cursor:pointer; display:block; margin:6px 0; padding:10px 12px; text-align:left; font:inherit; transition:.16s ease; }
    .place:hover, .place:focus { border-color:var(--accent); background:var(--soft); outline:none; }
    .place.is-active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(213,63,70,.14); background:var(--soft); }
    .place strong { display:block; font-size:14px; }
    .place small { display:block; margin-top:3px; color:var(--muted); font-size:12px; line-height:1.4; }
    .map-area { position:sticky; top:0; height:calc(100vh - 92px); display:flex; flex-direction:column; }
    .map-tools { align-items:center; background:var(--surface); border-bottom:1px solid var(--line); display:flex; flex:0 0 auto; flex-wrap:wrap; gap:8px; padding:10px 14px; }
    .map-tools button, .map-tools a { border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); cursor:pointer; font:inherit; font-size:13px; padding:7px 10px; text-decoration:none; white-space:nowrap; }
    .map-tools button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    #life-button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    #life-categories { align-items:center; background:var(--soft); border-bottom:1px solid var(--line); display:flex; flex:0 0 auto; flex-wrap:wrap; gap:6px; padding:8px 14px; }
    #life-categories .life-cat { border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--ink); cursor:pointer; font:inherit; font-size:12.5px; padding:6px 12px; white-space:nowrap; }
    #life-categories .life-cat.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .map-tools .selected { color:var(--muted); flex:1 1 100%; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #geoji-fab { align-items:center; background:#3B1E1E; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.25); color:#fff; display:flex; font-size:14px; font-weight:700; gap:8px; padding:13px 20px; position:fixed; right:18px; bottom:18px; text-decoration:none; z-index:999; transition:.15s ease; }
    #geoji-fab:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.3); }
    #geoji-fab .fab-icon { align-items:center; background:#fff; border-radius:50%; color:#3B1E1E; display:flex; flex-shrink:0; font-size:13px; font-weight:900; height:24px; justify-content:center; width:24px; }
    @media (max-width:640px){ #geoji-fab { bottom:14px; right:14px; padding:12px 16px; font-size:13px; } }
    #overview, #google-map, #naver-panel, #food-panel { flex:1 1 auto; min-height:0; width:100%; }
    #google-map { border:0; }
    #naver-panel, #food-panel { align-items:center; background:var(--surface); display:flex; flex-direction:column; justify-content:center; overflow:auto; padding:24px; text-align:center; }
    #naver-panel .naver-icon, #food-panel .naver-icon { align-items:center; background:var(--soft); border-radius:50%; color:var(--accent); display:flex; font-size:26px; font-weight:800; height:56px; justify-content:center; margin-bottom:14px; width:56px; }
    #naver-panel h3, #food-panel h3 { margin:0 0 6px; font-size:17px; }
    #naver-panel p.hint, #food-panel p.hint { color:var(--muted); font-size:13px; line-height:1.6; margin:0 0 20px; max-width:360px; }
    #food-panel .ko-term { background:var(--soft); border-radius:8px; color:var(--ink); font-size:15px; font-weight:700; margin:0 0 16px; padding:8px 14px; }
    .naver-links { display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; }
    .naver-link-btn { border:1px solid var(--line); border-radius:10px; color:var(--ink); display:block; font-size:14px; font-weight:600; padding:12px 14px; text-decoration:none; transition:.16s ease; cursor:pointer; }
    .naver-link-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .naver-link-btn:hover { opacity:.9; }
    .naver-link-btn small { color:inherit; display:block; font-size:12px; font-weight:400; margin-top:2px; opacity:.85; }
    .pin { align-items:center; background:var(--accent); border:2px solid #fff; border-radius:50%; color:#fff; display:flex; font:700 11px/1 sans-serif; height:25px; justify-content:center; width:25px; }
    .transit-icon { display:inline-block; width:1em; height:1em; vertical-align:-0.15em; margin:0 1px; fill:currentColor; flex-shrink:0; }
    .leaflet-popup-content { font-family:inherit; }
    .leaflet-popup-content b { display:block; margin-bottom:3px; }
    @media (max-width:760px) {
      header { padding:14px 16px 10px; }
      h1 { font-size:18px; }
      header p { font-size:12.5px; }
      .layout { grid-template-columns:1fr; }
      .itinerary { border-right:0; border-bottom:1px solid var(--line); height:30vh; max-height:30vh; padding:12px; }
      .map-area { height:60vh; }
      .map-tools { padding:8px 10px; gap:6px; }
      .map-tools button, .map-tools a { font-size:12px; padding:6px 8px; }
      #geoji-fab span:last-child { display:none; }
      #geoji-fab { padding:12px; }
    }
  </style>
</head>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const places = {

      lenith:{name:'HOTEL LENITH Seomyeon',q:'HOTEL LENITH Seomyeon Busan',qko:'호텔 레니스 서면',lat:35.1560,lng:129.0607},
      seomyeon:{name:'西面站／西面一號街',q:'Seomyeon Station, Busan',qko:'서면역',lat:35.1579,lng:129.0596},
      huinnyeoul:{name:'白淺灘文化村',q:'Huinnyeoul Culture Village, Busan',qko:'흰여울문화마을',lat:35.0782,lng:129.0450},
      gamcheon:{name:'甘川文化村',q:'Gamcheon Culture Village, Busan',qko:'감천문화마을',lat:35.0976,lng:129.0107},
      lottegwangbok:{name:'樂天百貨光復店',q:'Lotte Department Store Gwangbok, Busan',qko:'롯데백화점 광복점',lat:35.0983,lng:129.0365},
      biff:{name:'BIFF 廣場',q:'BIFF Square, Busan',qko:'BIFF광장',lat:35.0986,lng:129.0263},
      gijang:{name:'機張市場',q:'Gijang Market, Busan',qko:'기장시장',lat:35.2440,lng:129.2130},
      luge:{name:'Skyline Luge 釜山',q:'Skyline Luge Busan',qko:'스카이라인루지 부산',lat:35.1983,lng:129.2147},
      lotteworld:{name:'樂天世界釜山',q:'Lotte World Adventure Busan',qko:'롯데월드 어드벤처 부산',lat:35.1968,lng:129.2132},
      lottemart:{name:'樂天百貨釜山本店',q:'Lotte Department Store Busan Main, Busan',qko:'롯데백화점 부산본점',lat:35.1569,lng:129.0569},
      mipo:{name:'尾浦／海雲台藍線公園',q:'Mipo Station Haeundae Blueline Park, Busan',qko:'미포정거장 해운대 블루라인파크',lat:35.1587,lng:129.1711},
      cheongsapo:{name:'青沙浦',q:'Cheongsapo Daritdol Observatory, Busan',qko:'청사포 다릿돌전망대',lat:35.1603,lng:129.1995},

      spaland:{name:'Spa Land Centum City',q:'Spa Land Centum City, Busan',qko:'스파랜드 센텀시티',lat:35.1699,lng:129.1298},
      songdo:{name:'松島海上纜車',q:'Busan Air Cruise Songdo Cable Car',qko:'송도해상케이블카',lat:35.0773,lng:129.0161},
      songdobridge:{name:'松島龍宮雲橋',q:'Songdo Yonggung Suspension Bridge, Busan',qko:'송도용궁구름다리',lat:35.0750,lng:129.0200},
      jeonpo:{name:'田浦咖啡街',q:'Jeonpo Cafe Street, Busan',qko:'전포카페거리',lat:35.1555,lng:129.0669},
      gwanganli:{name:'廣安里海灘',q:'Gwangalli Beach, Busan',qko:'광안리해수욕장',lat:35.1532,lng:129.1188},
      bexco:{name:'BEXCO 釜山會展中心',q:'BEXCO, Busan',qko:'벡스코',lat:35.1686,lng:129.1362},
      emart:{name:'E-mart 門峴店',q:'E-Mart Munhyeon, Busan',qko:'이마트 문현점',lat:35.1393,lng:129.0670},
      hwangnyeongsan:{name:'荒嶺山烽燧臺',q:'Hwangnyeongsan Beacon Mound, Busan',qko:'황령산 봉수대',lat:35.1574,lng:129.1005},
      citizenpark:{name:'釜山市民公園',q:'Busan Citizens Park',qko:'부산시민공원',lat:35.1688,lng:129.0506},
      gimhae:{name:'金海國際機場',q:'Gimhae International Airport',qko:'김해국제공항',lat:35.1795,lng:128.9382}
    };
    const map = L.map('overview', {scrollWheelZoom:true}).setView([35.155,129.095], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
    const markers = {};
    const icon = n => L.divIcon({className:'',html:`<div class="pin">${n}</div>`,iconSize:[25,25],iconAnchor:[12,12]});
    Object.entries(places).forEach(([id,p],i) => { markers[id]=L.marker([p.lat,p.lng],{icon:icon(i+1)}).addTo(map).bindPopup(`<b>${p.name}</b><span>點選左側行程可開啟 Google 地圖定位</span>`); });
    const overview = document.getElementById('overview'); const frame = document.getElementById('google-map'); const naverPanel = document.getElementById('naver-panel'); const foodPanel = document.getElementById('food-panel'); const overviewButton = document.getElementById('overview-button'); const googleButton = document.getElementById('google-button'); const naverButton = document.getElementById('naver-button'); const foodButton = document.getElementById('food-button'); const lifeButton = document.getElementById('life-button'); const lifeCategories = document.getElementById('life-categories'); const selectedName = document.getElementById('selected-name'); const openGoogle = document.getElementById('open-google'); const openNaver = document.getElementById('open-naver'); const openFood = document.getElementById('open-food'); const openLife = document.getElementById('open-life'); let previousPlaceId = null; let currentMode = 'google'; let lifePlaceId = null; let currentLifeCat = 'restaurant';
    function setActiveButton(mode){ overviewButton.classList.toggle('active', mode==='overview'); googleButton.classList.toggle('active', mode==='google'); naverButton.classList.toggle('active', mode==='naver'); foodButton.classList.toggle('active', mode==='food'); lifeButton.classList.toggle('active', mode==='life'); openGoogle.style.display = (mode==='naver'||mode==='food'||mode==='life') ? 'none' : ''; openNaver.style.display = mode==='naver' ? '' : 'none'; openFood.style.display = mode==='food' ? '' : 'none'; openLife.style.display = mode==='life' ? '' : 'none'; lifeCategories.style.display = mode==='life' ? 'flex' : 'none'; currentMode = mode; }
    function showOverview(){ overview.style.display='block'; frame.style.display='none'; naverPanel.style.display='none'; foodPanel.style.display='none'; setActiveButton('overview'); selectedName.textContent='目前顯示全部行程地點'; setTimeout(()=>map.invalidateSize(),0); }
    function showGoogle(p, previous){ overview.style.display='none'; frame.style.display='block'; naverPanel.style.display='none'; foodPanel.style.display='none'; setActiveButton('google'); if(previous){ const route='https://www.google.com/maps?saddr='+encodeURIComponent(previous.q)+'&daddr='+encodeURIComponent(p.q); frame.src=route+'&output=embed'; openGoogle.href='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(previous.q)+'&destination='+encodeURIComponent(p.q)+'&travelmode=transit'; selectedName.textContent=previous.name+' → '+p.name; } else { frame.src='https://www.google.com/maps?q='+encodeURIComponent(p.q)+'&output=embed'; openGoogle.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.q); selectedName.textContent=p.name; } }
    function naverSearchUrl(p){ return 'https://map.naver.com/p/search/'+encodeURIComponent(p.qko || p.q); }
    function naverAppRouteUrl(previous, p){ return 'nmap://route/public?slat='+previous.lat+'&slng='+previous.lng+'&sname='+encodeURIComponent(previous.qko || previous.q)+'&dlat='+p.lat+'&dlng='+p.lng+'&dname='+encodeURIComponent(p.qko || p.q)+'&appname=busan.itinerary.map'; }
    function showNaver(p, previous){ overview.style.display='none'; frame.style.display='none'; foodPanel.style.display='none'; naverPanel.style.display='flex'; setActiveButton('naver'); const destUrl = naverSearchUrl(p); openNaver.href = destUrl; if(previous){ selectedName.textContent = previous.name+' → '+p.name; const routeUrl = naverAppRouteUrl(previous, p); naverPanel.innerHTML = '<div class="naver-icon">N</div><h3>'+previous.name+' → '+p.name+'</h3><p class="hint">Naver 地圖不支援嵌入預覽，請用下方連結在新分頁開啟（已自動代入韓文地點名稱，搜尋更準確）。手機若已安裝 Naver Map App，可直接開啟 App 內路線導航。</p><div class="naver-links"><a class="naver-link-btn primary" href="'+destUrl+'" target="_blank" rel="noopener">在 Naver 地圖開啟「'+p.name+'」<small>網頁版地點搜尋（'+(p.qko||p.q)+'）</small></a><a class="naver-link-btn" href="'+routeUrl+'">開啟 Naver Map App 路線導航<small>需手機已安裝 Naver Map App</small></a></div>'; } else { selectedName.textContent = p.name; naverPanel.innerHTML = '<div class="naver-icon">N</div><h3>'+p.name+'</h3><p class="hint">Naver 地圖不支援嵌入預覽，請用下方連結在新分頁開啟查看地點（已自動代入韓文地點名稱，搜尋更準確）。</p><div class="naver-links"><a class="naver-link-btn primary" href="'+destUrl+'" target="_blank" rel="noopener">在 Naver 地圖開啟「'+p.name+'」<small>網頁版地點搜尋（'+(p.qko||p.q)+'）</small></a></div>'; } }
    const GEOJI_URL = 'https://xn--v69ak0xskm.com/map';
    function kakaoMapUrl(p){ const koTerm = p.qko || p.q; return 'https://map.kakao.com/link/map/'+encodeURIComponent(koTerm)+','+p.lat+','+p.lng; }
    function showFood(p){ overview.style.display='none'; frame.style.display='none'; naverPanel.style.display='none'; foodPanel.style.display='flex'; setActiveButton('food'); selectedName.textContent=p.name+'｜Kakao 地圖精準定位'; const koTerm = p.qko || p.q; const kakaoUrl = kakaoMapUrl(p); openFood.href = kakaoUrl; foodPanel.innerHTML = '<div class="naver-icon">K</div><h3>'+p.name+'</h3><p class="hint">這裡直接用地點的經緯度定位，保證跳到正確位置（不需要搜尋、不會找錯地方）。Kakao 地圖是韓國最主流的地圖之一，開啟後可以直接在地圖上看到周邊餐廳、評分與菜單照片。</p><div class="naver-links"><a class="naver-link-btn primary" href="'+kakaoUrl+'" target="_blank" rel="noopener">在 Kakao 地圖精準開啟「'+p.name+'」<small>直接定位經緯度，100% 準確</small></a></div><p class="hint" style="margin:18px 0 10px">如果想找韓國網友整理的極致高 CP 值小吃，也可以到 <b style="color:var(--ink)">거지맵</b> 手動搜尋（該站不支援座標定位，需自行貼上搜尋詞）：</p><div class="ko-term" id="ko-term-text">'+koTerm+'</div><div class="naver-links"><button type="button" class="naver-link-btn" id="copy-ko-btn">複製韓文搜尋詞「'+koTerm+'」</button><a class="naver-link-btn" href="'+GEOJI_URL+'" target="_blank" rel="noopener">另開 거지맵<small>開啟後貼上剛複製的韓文搜尋</small></a></div>'; const copyBtn = document.getElementById('copy-ko-btn'); copyBtn.addEventListener('click', ()=>{ navigator.clipboard.writeText(koTerm).then(()=>{ copyBtn.textContent='已複製！「'+koTerm+'」'; setTimeout(()=>{ copyBtn.textContent='複製韓文搜尋詞「'+koTerm+'」'; },2000); }).catch(()=>{ copyBtn.textContent='複製失敗，請手動選取上方文字'; }); }); }
    const LIFE_CATEGORIES = {
      restaurant:{ label:'餐廳', term:'음식점' },
      snack:{ label:'小吃', term:'분식' },
      market:{ label:'超市', term:'마트' },
      cvs:{ label:'便利商店', term:'편의점' },
      mall:{ label:'商場', term:'쇼핑몰' }
    };
    const LIFE_ZOOM = 15;
    function lifeEmbedUrl(p, term){ return 'https://www.google.com/maps?q='+encodeURIComponent(term)+'&ll='+p.lat+','+p.lng+'&z='+LIFE_ZOOM+'&output=embed'; }
    function lifeOpenUrl(p, term){ return 'https://www.google.com/maps/search/'+encodeURIComponent(term)+'/@'+p.lat+','+p.lng+','+LIFE_ZOOM+'z'; }
    function showLife(p, catId){ overview.style.display='none'; naverPanel.style.display='none'; foodPanel.style.display='none'; frame.style.display='block'; setActiveButton('life'); lifePlaceId = Object.keys(places).find(k=>places[k]===p) || lifePlaceId; currentLifeCat = catId || currentLifeCat; const cat = LIFE_CATEGORIES[currentLifeCat] || LIFE_CATEGORIES.restaurant; frame.src = lifeEmbedUrl(p, cat.term); openLife.href = lifeOpenUrl(p, cat.term); selectedName.textContent = p.name+' 附近約 2km｜'+cat.label; document.querySelectorAll('#life-categories .life-cat').forEach(b=>b.classList.toggle('active', b.dataset.cat===currentLifeCat)); }
    document.querySelectorAll('#life-categories .life-cat').forEach(btn => btn.addEventListener('click', ()=>{ const p = lifePlaceId ? places[lifePlaceId] : (document.querySelector('.place.is-active') ? places[document.querySelector('.place.is-active').dataset.id] : places[Object.keys(places)[0]]); showLife(p, btn.dataset.cat); }));
    document.querySelectorAll('.place').forEach(btn => btn.addEventListener('click',()=>{ const id=btn.dataset.id, p=places[id], previous=previousPlaceId && previousPlaceId!==id ? places[previousPlaceId] : null; document.querySelectorAll('.place').forEach(x=>x.classList.remove('is-active')); btn.classList.add('is-active'); map.setView([p.lat,p.lng],14); markers[id].openPopup(); if(currentMode==='naver'){ showNaver(p,previous); } else if(currentMode==='food'){ showFood(p); } else if(currentMode==='life'){ showLife(p, currentLifeCat); } else { showGoogle(p,previous); } previousPlaceId=id; }));
    overviewButton.addEventListener('click',showOverview);
    googleButton.addEventListener('click',()=>{ const active=document.querySelector('.place.is-active'); if(active){ showGoogle(places[active.dataset.id]); } else { showGoogle(places[Object.keys(places)[0]]); } });
    naverButton.addEventListener('click',()=>{ const active=document.querySelector('.place.is-active'); if(active){ showNaver(places[active.dataset.id]); } else { showNaver(places[Object.keys(places)[0]]); } });
    foodButton.addEventListener('click',()=>{ const active=document.querySelector('.place.is-active'); if(active){ showFood(places[active.dataset.id]); } else { showFood(places[Object.keys(places)[0]]); } });
    lifeButton.addEventListener('click',()=>{ const active=document.querySelector('.place.is-active'); const p = active ? places[active.dataset.id] : places[Object.keys(places)[0]]; showLife(p, currentLifeCat); });
  </script>
